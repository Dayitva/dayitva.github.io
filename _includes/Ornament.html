{%- comment -%}
  Ornamental row-divider — two hairlines + a small central glyph.
  The glyph is a four-lobed dingbat echoing the "+>o<+" symbols in
  the printed-manuscript reference, drawn monochrome.
{%- endcomment -%}
<div class="ornament" aria-hidden="true">
    <div class="ornament-rule"></div>
    <svg class="ornament-glyph" viewBox="-14 -14 28 28">
        <circle r="6" fill="none" stroke="currentColor" stroke-width="1" />
        <circle class="ornament-center" r="2" />
        <g stroke="currentColor" stroke-width="1" fill="none">
            <path d="M-12 0 L-7 0 M12 0 L7 0 M0 -12 L0 -7 M0 12 L0 7" />
        </g>
        <g class="ornament-cardinals">
            <circle cx="-10" cy="0" r="1.2" />
            <circle cx="10" cy="0" r="1.2" />
            <circle cx="0" cy="-10" r="1.2" />
            <circle cx="0" cy="10" r="1.2" />
        </g>
    </svg>
    <div class="ornament-rule"></div>
</div>
