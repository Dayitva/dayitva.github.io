# Hackathon entries. Newest first within each role.
# Fields:
#   name         (built + workshop only) — project / workshop title
#   event        (required) — hackathon name (rendered as the TITLE)
#   date         (required) — e.g. "Nov 2024"
#   role         (required) — one of: built | mentored | judged | both | workshop
#   url          (optional) — ETHGlobal showcase / Devfolio / event page
#   affiliation  (optional) — e.g. "Uniswap Foundation". On advisory rows it
#                             renders inline as a title (e.g. "Uniswap Foundation
#                             Mentor"). On role: workshop it renders as "— {X}" below
#                             the workshop title.
#   workshop_title   (optional) — your records only; not shown on the site
#   workshop_youtube (optional) — on mentored/judged/both: chip after the role line
#   demo         (optional) — deployed demo URL; renders as a gold chip
#   youtube      (optional) — recording URL; renders as a gold chip
#   sponsors     (optional) — sponsor prize tracks won against (built only)
#   note         (optional) — e.g. "Finalist"

# ---- BUILT ------------------------------------------------------------------
